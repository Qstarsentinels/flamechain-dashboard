<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlameChain Mesh Telemetry</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #151922;
            --accent-orange: #ff5500;
            --accent-cyan: #00f0ff;
            --text-primary: #e0e6ed;
            --text-secondary: #8899a6;
            --border-color: #232d3f;
            --success-green: #00ff66;
            --error-red: #ff3333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-orange);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(0, 255, 102, 0.1);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-cyan);
        }

        .card .unit {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
        }

        .table-container h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 85, 0, 0.05);
            color: var(--accent-orange);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .source-indicator {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FlameChain Telemetry</h1>
        <div id="connection-status" class="status-badge">CONNECTING...</div>
    </div>

    <div class="grid-cards">
        <div class="card">
            <h3>Gross Supply</h3>
            <div><span class="value" id="gross-supply">0</span><span class="unit">FLAME</span></div>
        </div>
        <div class="card">
            <h3>Total Energy Reserve</h3>
            <div><span class="value" id="energy-wh">0</span><span class="unit">Wh</span></div>
        </div>
        <div class="card">
            <h3>Combined Mesh Memory</h3>
            <div><span class="value" id="mesh-memory">0</span><span class="unit">GB</span></div>
        </div>
    </div>

    <div class="table-container">
        <h2>Active Mesh Validators</h2>
        <table>
            <thead>
                <tr>
                    <th>Validator Key / Node Identifier</th>
                    <th>Status</th>
                    <th>RAM Allocated</th>
                    <th>Energy Reserve</th>
                    <th>Tokens Staked / Balance</th>
                </tr>
            </thead>
            <tbody id="nodes-table-body">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-secondary);">Querying state network...</td>
                </tr>
            </tbody>
        </table>
        <div id="data-source" class="source-indicator">Data Source: Synchronizing...</div>
    </div>

    <script>
        function parseRamGb(value) {
            if (typeof value === 'number') return value;
            if (typeof value === 'string') {
                const match = value.match(/([\d.]+)/);
                return match ? parseFloat(match[1]) : 0;
            }
            return 0;
        }

        function parseNumeric(value) {
            if (typeof value === 'number') return value;
            if (typeof value === 'string') {
                const match = value.match(/([\d.]+)/);
                return match ? parseFloat(match[1]) : 0;
            }
            return 0;
        }

        async function fetchTelemetry() {
            let data = null;
            let sourceLabel = "";

            try {
                const response = await fetch('./global_network_state.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                data = await response.json();
                sourceLabel = "./global_network_state.json";
            } catch (err) {
                console.warn("Relative fetch failed, attempting local fallback API:", err);
                try {
                    const fallback = await fetch('http://127.0.0.1:8546/api/state', { cache: 'no-cache' });
                    if (!fallback.ok) throw new Error(`HTTP ${fallback.status}`);
                    data = await fallback.json();
                    sourceLabel = "http://127.0.0.1:8546/api/state";
                } catch (fallbackErr) {
                    console.error("All telemetry sync attempts failed:", fallbackErr);
                    updateStatus(false, "Offline / Connection Failed");
                    return;
                }
            }

            processAndRenderTelemetry(data, sourceLabel);
        }

        function processAndRenderTelemetry(data, source) {
            updateStatus(true, `Synced via ${source}`);

            // Extract nodes map or object
            let nodesMap = {};
            if (data.nodes && typeof data.nodes === 'object' && !Array.isArray(data.nodes)) {
                nodesMap = data.nodes;
            } else if (data.validators && typeof data.validators === 'object' && !Array.isArray(data.validators)) {
                nodesMap = data.validators;
            } else if (Array.isArray(data.active_mesh_nodes) || Array.isArray(data.nodes)) {
                const list = data.active_mesh_nodes || data.nodes;
                list.forEach((item, index) => {
                    const id = typeof item === 'string' ? item : (item.node_id || item.id || `node_${index}`);
                    nodesMap[id] = typeof item === 'object' ? item : { status: "ACTIVE", endpoint: item };
                });
            }

            const nodeEntries = Object.entries(nodesMap);

            let computedGrossSupply = parseNumeric(data.gross_supply || data.total_supply || 0);
            let computedTotalEnergyWh = parseNumeric(data.energy_wh || data.total_watt_hours || 0);
            let computedTotalRamGb = parseRamGb(data.combined_mesh_memory_gb || data.total_network_ram_gb || 0);

            let sumEnergyWh = 0;
            let sumRamGb = 0;
            let sumSupply = 0;

            const tbody = document.getElementById('nodes-table-body');
            tbody.innerHTML = '';

            if (nodeEntries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No validator nodes found in state object.</td></tr>';
            } else {
                nodeEntries.forEach(([nodeId, nodeData]) => {
                    const nodeStatus = nodeData.status || nodeData.state || 'ACTIVE';
                    const nodeRam = parseRamGb(nodeData.ram || nodeData.ram_gb || nodeData.memory || nodeData.total_ram || 0);
                    const nodeEnergy = parseNumeric(nodeData.watt_hours || nodeData.energy_wh || nodeData.watt_hours_reserve || 0);
                    const nodeBalance = parseNumeric(nodeData.balance || nodeData.stake || nodeData.tokens || 0);

                    sumRamGb += nodeRam;
                    sumEnergyWh += nodeEnergy;
                    sumSupply += nodeBalance;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-family: monospace;">${nodeId}</td>
                        <td><span style="color: ${nodeStatus.includes('ACTIVE') ? 'var(--success-green)' : 'var(--text-secondary)'}; font-weight: bold;">${nodeStatus}</span></td>
                        <td>${nodeRam ? nodeRam + ' GB' : 'N/A'}</td>
                        <td>${nodeEnergy ? nodeEnergy.toLocaleString() + ' Wh' : 'N/A'}</td>
                        <td>${nodeBalance ? nodeBalance.toLocaleString() + ' FLAME' : 'N/A'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Fall back to aggregated sums if top-level values were not pre-calculated in JSON
            const finalSupply = computedGrossSupply > 0 ? computedGrossSupply : sumSupply;
            const finalEnergy = computedTotalEnergyWh > 0 ? computedTotalEnergyWh : sumEnergyWh;
            const finalRam = computedTotalRamGb > 0 ? computedTotalRamGb : sumRamGb;

            document.getElementById('gross-supply').innerText = finalSupply.toLocaleString();
            document.getElementById('energy-wh').innerText = finalEnergy.toLocaleString();
            document.getElementById('mesh-memory').innerText = finalRam.toLocaleString();
            document.getElementById('data-source').innerText = `Data Source: ${source} | Calculated across ${nodeEntries.length} node(s)`;
        }

        function updateStatus(online, message) {
            const statusBadge = document.getElementById('connection-status');
            if (online) {
                statusBadge.innerText = 'ONLINE';
                statusBadge.style.color = 'var(--success-green)';
                statusBadge.style.borderColor = 'var(--success-green)';
                statusBadge.style.background = 'rgba(0, 255, 102, 0.1)';
            } else {
                statusBadge.innerText = 'OFFLINE';
                statusBadge.style.color = 'var(--error-red)';
                statusBadge.style.borderColor = 'var(--error-red)';
                statusBadge.style.background = 'rgba(255, 51, 51, 0.1)';
                document.getElementById('data-source').innerText = `Data Source: ${message}`;
            }
        }

        // Initialize and bind recurring 5s sync loop
        fetchTelemetry();
        setInterval(fetchTelemetry, 5000);
    </script>
</body>
</html>
