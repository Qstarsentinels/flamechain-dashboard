<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlameChain // AGI Singularity Mesh Dashboard</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: #30363d;
            --accent-orange: #ff5500;
            --accent-cyan: #00f0ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            color: var(--accent-orange);
        }

        .status-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 4px 12px;
            border-radius: 12px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .grid-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            font-family: var(--font-mono);
        }

        .nodes-table-container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .pulse-dot {
            height: 8px;
            width: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px #00ff66;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <header>
        <h1><span>FLAMECHAIN</span> // MESH TELEMETRY</h1>
        <div class="status-badge" id="networkStatus">CONNECTING...</div>
    </header>

    <div class="grid-container">
        <div class="card">
            <div class="card-title">Active Mesh Nodes</div>
            <div class="card-value" id="nodeCount">0</div>
        </div>
        <div class="card">
            <div class="card-title">Total Active Memory</div>
            <div class="card-value" id="totalRam">0 MB</div>
        </div>
        <div class="card">
            <div class="card-title">Aggregate Energy (Wh)</div>
            <div class="card-value" id="totalWh">0.0 Wh</div>
        </div>
    </div>

    <div class="nodes-table-container">
        <table>
            <thead>
                <tr>
                    <th>NODE ID</th>
                    <th>PLATFORM / ARCH</th>
                    <th>RAM ALLOCATED</th>
                    <th>WATT-HOURS</th>
                    <th>LAST SEEN</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="nodesTableBody">
                <tr>
                    <td colspan="6" style="text-align: center; color: var(--text-muted);">Awaiting telemetry feed...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer-note" id="lastUpdatedNote">Cache-Busting Stream: Active</div>

    <script>
        const REFRESH_INTERVAL_MS = 3000;

        async function fetchNetworkState() {
            try {
                // Dynamic timestamp query parameter to bypass browser and CDN cache
                const cacheBusterUrl = `./global_network_state.json?t=${Date.now()}`;
                const response = await fetch(cacheBusterUrl, {
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                renderTelemetry(data);
            } catch (error) {
                console.error("[FlameChain Dashboard] Telemetry fetch error:", error);
                document.getElementById('networkStatus').innerText = "DISCONNECTED";
                document.getElementById('networkStatus').style.borderColor = "#ff3333";
                document.getElementById('networkStatus').style.color = "#ff3333";
            }
        }

        function renderTelemetry(data) {
            const nodes = data.nodes || {};
            const nodeList = Object.values(nodes);
            const now = Math.floor(Date.now() / 1000);

            document.getElementById('networkStatus').innerText = "MESH ONLINE";
            document.getElementById('networkStatus').style.borderColor = "var(--accent-cyan)";
            document.getElementById('networkStatus').style.color = "var(--accent-cyan)";

            document.getElementById('nodeCount').innerText = nodeList.length;

            let totalRam = 0;
            let totalWh = 0.0;

            const tableBody = document.getElementById('nodesTableBody');
            if (nodeList.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No active nodes detected in global state.</td></tr>`;
            } else {
                tableBody.innerHTML = nodeList.map(node => {
                    totalRam += (node.ram_mb || 0);
                    totalWh += (node.watt_hours || 0.0);
                    const secondsAgo = Math.max(0, now - Math.floor(node.last_seen || now));

                    return `
                        <tr>
                            <td><strong>${node.node_id || 'unknown'}</strong></td>
                            <td>${node.platform || 'N/A'} (${node.arch || 'ARM64'})</td>
                            <td>${node.ram_mb || 0} MB</td>
                            <td>${node.watt_hours ? node.watt_hours.toFixed(1) : '0.0'} Wh</td>
                            <td>${secondsAgo}s ago</td>
                            <td><span class="pulse-dot"></span>${node.status || 'ACTIVE'}</td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('totalRam').innerText = `${totalRam} MB`;
            document.getElementById('totalWh').innerText = `${totalWh.toFixed(1)} Wh`;
            document.getElementById('lastUpdatedNote').innerText = `Cache-Busting Stream: Syncing live | Epoch: ${data.last_updated || now}`;
        }

        // Initialize loop
        fetchNetworkState();
        setInterval(fetchNetworkState, REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
