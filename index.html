<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlameChain Mesh Telemetry</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #151922;
            --accent-orange: #ff5500;
            --accent-cyan: #00f0ff;
            --text-primary: #e0e6ed;
            --text-secondary: #8899a6;
            --border-color: #232d3f;
            --success-green: #00ff66;
            --error-red: #ff3333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-orange);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(0, 255, 102, 0.1);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-cyan);
        }

        .card .unit {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
        }

        .table-container h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 85, 0, 0.05);
            color: var(--accent-orange);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .source-indicator {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FlameChain Telemetry</h1>
        <div id="connection-status" class="status-badge">CONNECTING...</div>
    </div>

    <div class="grid-cards">
        <div class="card">
            <h3>Gross Supply</h3>
            <div><span class="value" id="gross-supply">0</span><span class="unit">FLAME</span></div>
        </div>
        <div class="card">
            <h3>Total Energy Reserve</h3>
            <div><span class="value" id="energy-wh">0</span><span class="unit">Wh</span></div>
        </div>
        <div class="card">
            <h3>Combined Mesh Memory</h3>
            <div><span class="value" id="mesh-memory">0</span><span class="unit">GB</span></div>
        </div>
    </div>

    <div class="table-container">
        <h2>Active Mesh Validators</h2>
        <table>
            <thead>
                <tr>
                    <th>Node Identifier</th>
                    <th>Status</th>
                    <th>RAM Allocated</th>
                    <th>Energy Consumed</th>
                    <th>Tokens Minted</th>
                </tr>
            </thead>
            <tbody id="nodes-table-body">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-secondary);">Querying state network...</td>
                </tr>
            </tbody>
        </table>
        <div id="data-source" class="source-indicator">Data Source: Synchronizing...</div>
    </div>

    <script>
        function safeParseFloat(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            if (typeof val === 'string') {
                const match = val.match(/-?[\d.]+/);
                return match ? parseFloat(match[0]) : 0;
            }
            return 0;
        }

        function extractNodeRamGb(node) {
            if (node.system_ram_mb !== undefined) {
                return safeParseFloat(node.system_ram_mb) / 1024.0;
            }
            if (node.ram_mb !== undefined) {
                return safeParseFloat(node.ram_mb) / 1024.0;
            }
            if (node.ram_gb !== undefined) {
                return safeParseFloat(node.ram_gb);
            }
            if (node.ram !== undefined) {
                const parsed = safeParseFloat(node.ram);
                return typeof node.ram === 'string' && node.ram.toLowerCase().includes('mb') ? parsed / 1024.0 : parsed;
            }
            if (node.system_ram !== undefined) {
                return safeParseFloat(node.system_ram) / 1024.0;
            }
            return 0;
        }

        function extractNodeWh(node) {
            if (node.wh_consumed !== undefined) return safeParseFloat(node.wh_consumed);
            if (node.wh !== undefined) return safeParseFloat(node.wh);
            if (node.watt_hours !== undefined) return safeParseFloat(node.watt_hours);
            if (node.energy_wh !== undefined) return safeParseFloat(node.energy_wh);
            if (node.watt_hours_reserve !== undefined) return safeParseFloat(node.watt_hours_reserve);
            return 0;
        }

        function extractNodeMinted(node) {
            if (node.flame_minted !== undefined) return safeParseFloat(node.flame_minted);
            if (node.minted_tokens !== undefined) return safeParseFloat(node.minted_tokens);
            if (node.balance !== undefined) return safeParseFloat(node.balance);
            if (node.stake !== undefined) return safeParseFloat(node.stake);
            if (node.tokens !== undefined) return safeParseFloat(node.tokens);
            return 0;
        }

        async function fetchTelemetry() {
            let data = null;
            let sourceLabel = "";

            try {
                const response = await fetch('./global_network_state.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                data = await response.json();
                sourceLabel = "./global_network_state.json";
            } catch (err) {
                console.warn("Relative fetch failed, attempting local API endpoint:", err);
                try {
                    const fallback = await fetch('http://127.0.0.1:8546/api/state', { cache: 'no-cache' });
                    if (!fallback.ok) throw new Error(`HTTP ${fallback.status}`);
                    data = await fallback.json();
                    sourceLabel = "http://127.0.0.1:8546/api/state";
                } catch (fallbackErr) {
                    console.error("All telemetry sources unavailable:", fallbackErr);
                    updateStatus(false, "Offline / Sync Failed");
                    return;
                }
            }

            processAndRenderTelemetry(data, sourceLabel);
        }

        function processAndRenderTelemetry(data, source) {
            updateStatus(true, `Synced via ${source}`);

            let nodesMap = {};
            if (data.nodes && typeof data.nodes === 'object' && !Array.isArray(data.nodes)) {
                nodesMap = data.nodes;
            } else if (data.validators && typeof data.validators === 'object' && !Array.isArray(data.validators)) {
                nodesMap = data.validators;
            } else if (Array.isArray(data.active_mesh_nodes) || Array.isArray(data.nodes)) {
                const list = data.active_mesh_nodes || data.nodes;
                list.forEach((item, index) => {
                    const id = typeof item === 'string' ? item : (item.node_id || item.id || `node_${index}`);
                    nodesMap[id] = typeof item === 'object' ? item : { status: "ACTIVE", endpoint: item };
                });
            }

            const nodeEntries = Object.entries(nodesMap);

            let calculatedGrossSupply = 0.0;
            let calculatedEnergyWh = 0.0;
            let calculatedRamGb = 0.0;

            const tbody = document.getElementById('nodes-table-body');
            tbody.innerHTML = '';

            if (nodeEntries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No dynamic validator node telemetry detected.</td></tr>';
            } else {
                nodeEntries.forEach(([key, nodeObj]) => {
                    const nodeId = nodeObj.node_id || nodeObj.id || key;
                    const nodeStatus = nodeObj.status || nodeObj.state || 'ACTIVE';
                    
                    const nodeMinted = extractNodeMinted(nodeObj);
                    const nodeWh = extractNodeWh(nodeObj);
                    const nodeRamGb = extractNodeRamGb(nodeObj);

                    calculatedGrossSupply += nodeMinted;
                    calculatedEnergyWh += nodeWh;
                    calculatedRamGb += nodeRamGb;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-family: monospace; font-weight: bold;">${nodeId}</td>
                        <td><span style="color: ${nodeStatus.includes('ACTIVE') ? 'var(--success-green)' : 'var(--text-secondary)'}; font-weight: bold;">${nodeStatus}</span></td>
                        <td>${nodeRamGb > 0 ? nodeRamGb.toFixed(2) + ' GB' : 'N/A'}</td>
                        <td>${nodeWh > 0 ? nodeWh.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 3}) + ' Wh' : 'N/A'}</td>
                        <td>${nodeMinted > 0 ? nodeMinted.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 4}) + ' FLAME' : 'N/A'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Fallback to top-level json properties if nodes map is empty or unpopulated
            const topLevelSupply = safeParseFloat(data.gross_supply || data.total_supply);
            const topLevelWh = safeParseFloat(data.energy_wh || data.total_watt_hours);
            const topLevelRam = safeParseFloat(data.combined_mesh_memory_gb || data.total_network_ram_gb);

            const finalSupply = calculatedGrossSupply > 0 ? calculatedGrossSupply : topLevelSupply;
            const finalWh = calculatedEnergyWh > 0 ? calculatedEnergyWh : topLevelWh;
            const finalRam = calculatedRamGb > 0 ? calculatedRamGb : topLevelRam;

            document.getElementById('gross-supply').innerText = finalSupply.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4});
            document.getElementById('energy-wh').innerText = finalWh.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 3});
            document.getElementById('mesh-memory').innerText = finalRam.toFixed(2);
            document.getElementById('data-source').innerText = `Data Source: ${source} | Aggregated ${nodeEntries.length} Node Telemetry Stream(s)`;
        }

        function updateStatus(online, message) {
            const statusBadge = document.getElementById('connection-status');
            if (online) {
                statusBadge.innerText = 'ONLINE';
                statusBadge.style.color = 'var(--success-green)';
                statusBadge.style.borderColor = 'var(--success-green)';
                statusBadge.style.background = 'rgba(0, 255, 102, 0.1)';
            } else {
                statusBadge.innerText = 'OFFLINE';
                statusBadge.style.color = 'var(--error-red)';
                statusBadge.style.borderColor = 'var(--error-red)';
                statusBadge.style.background = 'rgba(255, 51, 51, 0.1)';
                document.getElementById('data-source').innerText = `Data Source: ${message}`;
            }
        }

        fetchTelemetry();
        setInterval(fetchTelemetry, 5000);
    </script>
</body>
</html>
