<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="30">
    <title>FlameChain AGI Singularity Mesh State</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 2rem; }
        h1 { color: #ff5500; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 1.5rem; border-radius: 6px; margin-bottom: 1rem; }
        .status-ok { color: #3fb950; font-weight: bold; }
        pre { color: #58a6ff; }
    </style>
</head>
<body>
    <h1>FlameChain AGI Mesh Telemetry Portal</h1>
    <div class="card">
        <h3>Node Sync Status: <span class="status-ok">SYNCHRONIZED</span></h3>
        <p><strong>Primary Controller:</strong> Android Galaxy Tab (Termux Runtime)</p>
        <p><strong>RPC Mesh Ports:</strong> 9998, 9999 [ACTIVE]</p>
    </div>
    <div class="card">
        <h3>System Telemetry:</h3>
        <pre id="telemetry-data">Loading telemetry...</pre>
    </div>
    <script>
        fetch('node_telemetry.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('telemetry-data').textContent = JSON.stringify(data, null, 4);
            })
            .catch(err => {
                document.getElementById('telemetry-data').textContent = "State loading...";
            });
    </script>
</body>
</html>
